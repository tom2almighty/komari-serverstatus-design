name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - .gitignore
      - LICENSE
      - preview.png
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - .gitignore
      - LICENSE
      - preview.png
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # tsc -b is the first half of `pnpm run build`; it is the type check.
      - name: Build
        run: pnpm run build

      - name: Verify the theme package
        run: pnpm run verify

      - name: Upload theme.zip
        uses: actions/upload-artifact@v7
        with:
          name: theme
          path: theme.zip
          if-no-files-found: error
